[project]
name = "peon-pet"
version = "0.1.0"
description = "Desktop pet that reacts to peon-ping events"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "PySide6>=6.11",
]

[project.scripts]
peon-pet = "peon_pet.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peon_pet"]

[tool.pytest.ini_options]
log_level = "DEBUG"          # capture DEBUG+ per test; shown on failure
log_format = "%(levelname)s %(name)s: %(message)s"

[tool.coverage.run]
source = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "coverage>=7.15.2",
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.16.0",
]
