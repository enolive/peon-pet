name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Qt6 system libraries
        # PyQt6's offscreen platform plugin needs libGL/libEGL/libxcb etc., which
        # are not on the minimal ubuntu-latest image. Without them, importing
        # PyQt6 fails before conftest.py can set QT_QPA_PLATFORM=offscreen.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync

      - name: format check
        run: uv run ruff format --check .

      - name: type check
        # LC_ALL=C forces English output
        env:
          LC_ALL: C
        run: uv run basedpyright

      - name: test
        run: uv run coverage run -m pytest

      - name: coverage report
        run: uv run coverage report
