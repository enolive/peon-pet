name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Qt6 system libraries
        # PyQt6's offscreen platform plugin (selected by conftest.py) needs
        # libGL/libEGL/libxkbcommon/libdbus/libxcb, which aren't on the minimal
        # ubuntu-latest image. Only the offscreen plugin is loaded (not xcb),
        # so the libxcb-* util libs aren't needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb1

      - name: Install dependencies
        run: uv sync

      - name: format check
        run: uv run ruff format --check .

      - name: type check
        # LC_ALL=C forces English output
        env:
          LC_ALL: C
        run: uv run basedpyright

      - name: test
        run: uv run coverage run -m pytest

      - name: coverage report
        run: uv run coverage report
